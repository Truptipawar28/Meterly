server.port=9091
# --- Database connection (matches compose.yaml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/meterly
spring.datasource.username=meterly
spring.datasource.password=meterly

# --- JPA ---
# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Meterly ---
# How many times usage ingestion retries after a concurrent-update conflict (Step 5)
meterly.usage.max-attempts=20
