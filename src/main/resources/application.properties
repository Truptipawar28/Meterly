server.port=9091
# --- Database connection (matches compose.yaml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/meterly
spring.datasource.username=meterly
spring.datasource.password=meterly

# --- JPA ---
# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Meterly ---
# How many times usage ingestion retries after a concurrent-update conflict (Step 5)
meterly.usage.max-attempts=20

# --- Security (Step 8) ---
# HS256 signing key, at least 32 bytes. Override in real environments: METERLY_JWT_SECRET=...
meterly.security.jwt-secret=${METERLY_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
meterly.security.token-ttl=8h
# Demo users for POST /api/auth/token (dev only)
meterly.security.users.admin.password=admin123
meterly.security.users.admin.roles=ADMIN
meterly.security.users.worker.password=worker123
meterly.security.users.worker.roles=WRITER
meterly.security.users.client.password=client123
meterly.security.users.client.roles=READER
meterly.security.users.client.account-id=1

# --- Demo data: creates sample accounts/usage on an empty database ---
meterly.demo-data.enabled=true
